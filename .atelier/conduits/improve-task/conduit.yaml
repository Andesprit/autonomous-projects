name: improve-task
description: "Drain a project's task inbox — for each raw task the user dropped in the tasks folder, generate a spec and a plan, then store it as a priority-1 task_*.md in the backlog."
timeout: 7200
max_concurrency: 1

inputs:
  project_document: "Path to the project document (goal/constraints/context) the agent reads to ground each task."
  template_dir: "Directory holding task_template.md (threaded from the parent conduit)."
  path_task: "Folder where the user drops raw task files to improve (the task inbox)."
  path_backlog: "Target folder where the improved task_*.md documents are written."
  target: "How many tasks the parent wants spec'd this tick (the n_improve count)."
  prior: "The previous iteration's counter output ({{loop.previous}}); empty on iteration 1."
  max_usage: {default: "80"}   # usage ceiling %; the per-iteration re-check stops the loop when the harness is at/over it

tasks:
  - count:
      description: "Gate the activity off once `target` tasks have been spec'd this tick."
      tool: tool:bash
      depends_on: []
      task: |
        python3 "{{conduit_dir}}/../autonomous-projects/scripts/loop_count.py" \
          --phase count --target "$INPUT_TARGET" --prior "$INPUT_PRIOR" \
          --conduit improve-task --max-usage "$INPUT_MAX_USAGE"

  - pick_task:
      description: "Pick the first inbox Markdown file and capture its identity and original text."
      tool: tool:bash
      depends_on:
        - 'count.output.not_match(remaining:\s*0)'
      task: |
        python3 "{{conduit_dir}}/../autonomous-projects/scripts/store_improved_task.py" pick "$INPUT_PATH_TASK"

  - improve_task:
      description: Produce the spec and implementation plan for one raw task.
      tool: harness:claude-code
      permissions: read-only
      depends_on:
        - 'pick_task.output.match(^picked: )'
      retries: 2
      retry_backoff: 5
      task: |
        Use /agent-skills:spec and /agent-skills:plan in this single response.
        Read {{inputs.project_document}} for the project's goal, constraints,
        and codebase location. Inspect that codebase and preserve the user's intent.
        Work unattended, record open questions in the spec, and write all results
        inline. The first line below identifies the input. The rest is the raw task.

        {{pick_task.output}}

        Return one nonempty spec and one actionable plan. Use the exact marker
        lines below and a lowercase kebab-case slug. Use ## for section headings.

        ===TASK START===
        <spec>
        ===TASK END===
        ===PLAN START===
        <plan>
        ===PLAN END===
        TASK_SLUG: <kebab-case-name>

  - store_task:
      description: "Publish and verify the card before removing the unchanged inbox file."
      tool: tool:bash
      depends_on: [pick_task, improve_task]
      task: |
        python3 "{{conduit_dir}}/../autonomous-projects/scripts/store_improved_task.py" store \
          "$INPUT_PATH_TASK" "$INPUT_PATH_BACKLOG" "$INPUT_TEMPLATE_DIR/task_template.md" \
          "$OUTPUT_PICK_TASK_FILE" < "$OUTPUT_IMPROVE_TASK_FILE"

  - advance:
      description: "Count the stored task toward the per-tick target."
      tool: tool:bash
      depends_on:
        - 'store_task.output.match(^stored: true)'
      task: |
        python3 "{{conduit_dir}}/../autonomous-projects/scripts/loop_count.py" \
          --phase advance --target "$INPUT_TARGET" --prior "$INPUT_PRIOR"

  - count_inbox:
      description: "Stop the parent loop when the successful store drains the inbox."
      tool: tool:bash
      depends_on:
        - 'store_task.output.match(^stored: true)'
      task: |
        python3 "{{conduit_dir}}/../autonomous-projects/scripts/count_tasks.py" "$INPUT_PATH_TASK"
