name: generate-adhd-idea
description: >
  Generate one idea for a project through the `adhd` skill's divergent
  ideation loop (5 isolated cognitive frames, then a critic pass), plan the
  surviving non-obvious pick, and store it as an adhd_*.md idea document.
  Expensive by design — roughly 10 agent calls and ~30 min per idea.
timeout: 7200
max_concurrency: 1

inputs:
  project_document: Path to the project document (goal/constraints/context) the agent reads.
  template_dir: "Directory holding task_template.md (threaded from the parent conduit)."
  path_idea: "Folder holding prior idea_*/adhd_* (and queued task_*/review_*) documents; the new adhd_*.md is written here."
  bad_ideas: "Folder of rejected-idea files the agent must read to avoid re-proposing them."
  tasks_dir: "Project root whose 01_to-do/02_in-progress/03_to-review/04_done subfolders the agent reads for prior work."
  target: "How many adhd ideas the parent wants this tick (the n_adhd count)."
  prior: "The previous iteration's counter output ({{loop.previous}}); empty on iteration 1."
  max_usage: {default: "80"}   # usage ceiling %; the per-iteration re-check stops the loop when the harness is at/over it

tasks:
  - count:
      description: "Gate the activity off once `target` adhd ideas have been made this tick."
      tool: tool:bash
      depends_on: []
      task: |
        python3 "{{conduit_dir}}/../autonomous-projects/scripts/loop_count.py" \
          --phase count --target "{{inputs.target}}" --prior "{{inputs.prior}}" \
          --conduit generate-adhd-idea --max-usage "{{inputs.max_usage}}"

  - diverge:
      description: Run the adhd divergent-ideation loop and emit its non-obvious pick as one idea.
      tool: harness:claude-code
      depends_on:
        - 'count.output.not_match(remaining:\s*0)'
      retries: 2
      retry_backoff: 5
      task: |
        Use the `adhd` skill.

        This is an explicit ADHD invocation: SKIP the skill's pre-flight gate
        and go straight to Phase 1. Do not abort, do not "answer directly
        instead", and do not substitute a single-shot idea for the loop — the
        divergence is the whole point of this step. Run the real loop: 5
        parallel, isolated Agent calls under 5 different frames, then the
        scoring / clustering / trap-flagging critic pass, then deepen the top
        survivors. Vary your frame picks from run to run.

        This is a single non-interactive turn — nobody will prompt you again.
        The branch Agent calls return their results to you inside this same
        turn, so when they come back, go straight on to Phase 2 and then to
        the output below. Do NOT end your turn after launching the branches,
        do NOT emit a progress note like "waiting on the branches", and do NOT
        ask whether to continue. Your turn ends only when the IDEA_SLUG line
        below has been written; a response without the markers is a failed
        step, not a partial one.

        The problem to diverge on: what is the highest-leverage improvement
        to make to THIS codebase right now — the one a careful maintainer
        would not have reached for first?

        Read this project document first to understand the project's goal and
        constraints, and ground every branch in it: {{inputs.project_document}}

        Then read the codebase at the path outlined in the project document.
        Every branch must diverge on the real code, not on a generic project.
        The project's `# Constraints` are binding: an idea that violates one is
        a trap, flag it as such and do not let it win.

        Before diverging, review prior context so you don't repeat work:
        - Existing proposals live in this folder: {{inputs.path_idea}}
          Read the idea_*.md, adhd_*.md, task_*.md and review_*.md files
          there — those are already-written-up proposals waiting to be
          promoted. Your pick MUST be meaningfully distinct from every one of
          them.
        - Rejected ideas live in this folder: {{inputs.bad_ideas}}
          Each file holds a bad idea and the user's reasoning for why it is bad.
          Do NOT propose ideas of those kinds; respect the stated reasoning.
        - Existing tasks live under this directory: {{inputs.tasks_dir}}
          Read the .md files in its `01_to-do/`, `02_in-progress/`, `03_to-review/`,
          and `04_done/` subfolders — their `# Description` sections describe work
          already queued, being worked, implemented and awaiting review, or
          completed (`# What was done` records the result for finished tasks).
          Your pick MUST NOT duplicate any of them.
        If a path is empty or the folder does not exist, treat it as "no prior
        ideas/tasks" and continue.

        Then pick ONE idea to carry forward: the shortlist entry you marked ★
        (the non-obvious-but-viable pick). Never carry forward an idea you
        flagged as a trap, and never carry forward one that is merely the
        obvious answer wearing a costume.

        Output format (strict):
        - Render the full ADHD session first (brief, wide set, converge,
          focus, provocation) — that is your working, and NONE of it may
          appear inside the markers below.
        - Then emit the chosen idea between the two marker lines below, on
          their own lines, with ONLY the idea text in between (no preamble, no
          tool commentary, no closing remarks):
          ===IDEA START===
          ===IDEA END===
        - Inside the markers, write for a non-expert: the "what" and the "why"
          in everyday terms, anchored to the real files you read, plus one
          plain sentence on what makes this pick non-obvious. Fold in the
          deepened branch's load-bearing risk and first concrete step. Avoid
          jargon and deep implementation detail here — that belongs in the
          plan, not the description. Do not use the score chips, cluster
          labels, or the ★ inside the markers.
        - After the END marker, output one final line naming the idea
          (lowercase, kebab-case, no spaces):
          IDEA_SLUG: <kebab-case-name>

  - require_idea:
      description: >
        Say out loud whether diverge honoured its output contract (it can end
        its turn after launching the branches). On a miss it emits
        `remaining: 0`, which stops THIS branch and leaves the sibling branches
        running — the engine is fail-fast, so failing here would cancel them.
      tool: tool:bash
      depends_on: [diverge]
      task: |
        # The heredoc must NOT sit inside a $( ): bash's scanner tracks quotes
        # through it, so one apostrophe in the model's prose ("doesn't") breaks
        # the parse. The blank line before the terminator keeps ADHD_EOF on its
        # own line even though the harness output has no trailing newline.
        python3 "{{conduit_dir}}/../autonomous-projects/scripts/require_markers.py" \
          --kind IDEA <<'ADHD_EOF'
        {{diverge.output}}

        ADHD_EOF

  - generate_plan:
      description: Produce a plan for the chosen idea, inline only.
      tool: harness:claude-code
      depends_on:
        - 'require_idea.output.match(ok:\s*true)'
      retries: 2
      retry_backoff: 5
      task: |
        /agent-skills:plan

        Plan against the codebase that holds this project document —
        {{inputs.project_document}} — that is, the repo containing its
        `.atelier/project/` folder. Read the document first for the goal and
        the binding constraints. Do NOT plan against the current working
        directory: the tick may have been launched from anywhere.

        Create a plan for the following idea (use only the text between the
        "===IDEA START===" / "===IDEA END===" markers; ignore everything else):

        ---
        {{diverge.output}}
        ---

        IMPORTANT: Output the full plan inline in your response only. Do NOT write
        the plan to any file on disk — no `tasks/plan.md`, no `tasks/todo.md`,
        no file of any other name. The conduit stores the plan itself.

        Output format (strict):
        - Do all reasoning first; NONE of that narration may appear in the plan.
        - Emit the plan between the two marker lines below, with ONLY the plan in
          between (no preamble, no narration). Do not put a top-level "# Plan"
          heading inside; use "##" for any section headings:
          ===PLAN START===
          ===PLAN END===

  - store_idea:
      description: Assemble the idea document from the template and write it to path_idea.
      tool: harness:claude-code
      depends_on: [diverge, generate_plan]
      retries: 2
      retry_backoff: 5
      task: |
        Create one idea document and write it to disk.

        1. Read the template at:
           {{inputs.template_dir}}/task_template.md
           Fill the sections present in that template — it is the single source
           of truth for the section set (not re-listed here).

        2. Fill the sections:
           - "# Description": ONLY the text between the "===IDEA START===" and
             "===IDEA END===" markers in the idea below. Strip a leading
             top-level "# ..." heading if present (the template already
             provides "# Description"), and demote any other top-level "# "
             headings inside it to "## " so they don't read as document
             sections — but ONLY outside fenced code blocks: a "#"
             starting a line inside ``` fences is a code comment, leave
             it exactly as is. Discard everything outside the markers (the ADHD
             session itself, model narration, the markers themselves, and the
             IDEA_SLUG line).
           - "# Plan": ONLY the text between the "===PLAN START===" and
             "===PLAN END===" markers in the plan below. Strip a leading
             top-level "# ..." heading if present (the template already provides
             "# Plan"). Discard everything outside the markers.
           - Frontmatter: set `priority: 3`
           - Leave "# Spec", "# User comments", "# What was done", and
             "# How was done and tested" empty. Set `creation_datetime` to the
             output of `date '+%Y-%m-%d %H:%M:%S %Z'`, and leave
             `modified_datetime` and `commits` blank — the human and the
             executor fill those later.

        3. Determine the slug from the "IDEA_SLUG:" line in the idea below.

        4. Run: mkdir -p "{{inputs.path_idea}}"
           Then write the filled document to:
           {{inputs.path_idea}}/adhd_<slug>.md
           (literal prefix "adhd_" followed by the slug, e.g. adhd_dark-mode.md).

        Idea:
        ---
        {{diverge.output}}
        ---

        Plan:
        ---
        {{generate_plan.output}}
        ---

  - advance:
      description: "Advance the per-tick counter (made: N) so the parent loop stops at target."
      tool: tool:bash
      depends_on: [store_idea]
      task: |
        python3 "{{conduit_dir}}/../autonomous-projects/scripts/loop_count.py" \
          --phase advance --target "{{inputs.target}}" --prior "{{inputs.prior}}"
