name: generate-idea
description: Generate one idea for a project, plan it, and store it as an idea document.
timeout: 3600
max_concurrency: 1

inputs:
  project_document: Path to the project document (goal/constraints/context) the agent reads.
  template_dir: "Directory holding task_template.md (threaded from the parent conduit)."
  path_idea: "Folder holding prior idea_*.md (and queued task_*/review_*) documents; the new idea_*.md is written here."
  bad_ideas: "Folder of rejected-idea files the agent must read to avoid re-proposing them."
  tasks_dir: "Project root whose 01_to-do/02_in-progress/03_to-review/04_done subfolders the agent reads for prior work."
  target: "How many ideas the parent wants this tick (the n_ideas count)."
  prior: "The previous iteration's counter output ({{loop.previous}}); empty on iteration 1."
  max_usage: {default: "80"}   # usage ceiling %; the per-iteration re-check stops the loop when the harness is at/over it

tasks:
  - count:
      description: "Gate the activity off once `target` ideas have been made this tick."
      tool: tool:bash
      depends_on: []
      task: |
        python3 "{{conduit_dir}}/../autonomous-projects/scripts/loop_count.py" \
          --phase count --target "{{inputs.target}}" --prior "{{inputs.prior}}" \
          --conduit generate-idea --max-usage "{{inputs.max_usage}}"

  - generate_idea:
      description: Generate one concrete idea for the project.
      tool: harness:claude-code
      depends_on:
        - 'count.output.not_match(remaining:\s*0)'
      retries: 2
      retry_backoff: 5
      task: |
        Propose ONE improvement idea for this codebase: a single theme plus 2-4
        concrete small wins that ladder up to it. Propose only — never edit
        code, never start implementing.

        Read this project document first to understand the project's goal and
        constraints, and ground your idea in it: {{inputs.project_document}}

        Then focus on the codebase at the path outlined in the project document

        Before proposing anything, review prior context so you don't repeat work:
        - Existing ideas live in this folder: {{inputs.path_idea}}
          Read the idea_*.md and adhd_*.md files there. Also read the task_*.md
          and review_*.md files in the same folder — those are already-written-up
          proposals waiting to be promoted. Your new idea MUST be meaningfully
          distinct from every one of them.
        - Rejected ideas live in this folder: {{inputs.bad_ideas}}
          Each file holds a bad idea and the user's reasoning for why it is bad.
          Do NOT propose ideas of those kinds; respect the stated reasoning.
        - Existing tasks live under this directory: {{inputs.tasks_dir}}
          Read the .md files in its `01_to-do/`, `02_in-progress/`, `03_to-review/`,
          and `04_done/` subfolders — their `# Description` sections describe work
          already queued, being worked, implemented and awaiting review, or
          completed (`# What was done` records the result for finished tasks).
          Your new idea MUST NOT duplicate any of them.
        If a path is empty or the folder does not exist, treat it as "no prior
        ideas/tasks" and continue.

        How to find the idea:
        1. Survey before proposing. Read — don't skim: the directory layout and
           entry points, the files that actually carry the load (the biggest,
           the most-imported, the hot path), and the friction signals
           (TODO/FIXME/HACK comments, duplicated blocks, a thin test dir, long
           functions, commented-out code, patterns that disagree between
           modules).
        2. Rotate the lens. This conduit runs again and again, so pick a
           dimension you did not just cover: architecture & boundaries,
           developer experience, testing & confidence, consistency,
           performance, robustness, maintainability. Run
           `git log --oneline -30` and steer AWAY from whatever was just worked
           on. If a lens has nothing grounded in real observed code, drop it —
           do not invent a problem to fill it.
        3. State one theme: what it is, why it matters for THIS codebase (cite
           the evidence you found), and what better looks like. Be honest about
           cost vs. payoff.
        4. Under it, name 2-4 small wins. Each points at a specific file (and
           function/line where you can) and could land as one small change.
           Present them as an unordered set — do not rank them, sequence them,
           or tag one as the place to start.

        Evidence or it's cut: if you cannot name the file and the specific
        thing you saw, you have not earned the suggestion — delete it. Generic
        advice ("add more tests", "improve error handling", "add
        documentation") applies to every codebase and points at nothing; it is
        never an acceptable idea here. One well-grounded small win beats four
        vague ones.

        Produce exactly ONE idea. Do not propose multiple competing ideas.

        Write the idea text (the part between the markers) in plain, accessible
        language a non-expert can follow: explain the "what" and the "why" in
        everyday terms. Avoid jargon and deep implementation detail here — that
        belongs in the plan, not the description.

        Output format (strict):
        - Do all exploration and reasoning first; NONE of that narration may
          appear in the final idea.
        - Emit the idea between the two marker lines below, on their own lines,
          with ONLY the idea text in between (no preamble, no tool commentary,
          no closing remarks):
          ===IDEA START===
          ===IDEA END===
        - After the END marker, output one final line naming the idea
          (lowercase, kebab-case, no spaces):
          IDEA_SLUG: <kebab-case-name>

  - require_idea:
      description: >
        Say out loud whether generate_idea honoured its ===IDEA=== output
        contract. Without this, a step that ended its turn early (returning
        narration instead of an idea) still flows into store_idea, which then
        assembles an idea document out of that narration. On a miss it emits
        `remaining: 0`, which stops THIS branch and leaves the sibling branches
        running — the engine is fail-fast, so failing here would cancel them.
      tool: tool:bash
      depends_on: [generate_idea]
      task: |
        # The heredoc must NOT sit inside a $( ): bash's scanner tracks quotes
        # through it, so one apostrophe in the model's prose ("doesn't") breaks
        # the parse. The blank line before the terminator keeps it on its own
        # line even though the harness output has no trailing newline.
        # ponytail: a quoted heredoc is the safest primitive available for piping
        # model text through bash, but a payload line equal to the terminator
        # would still close it early — hence a terminator no prose would emit.
        python3 "{{conduit_dir}}/../autonomous-projects/scripts/require_markers.py" \
          --kind IDEA <<'__ATELIER_PAYLOAD_EOF__'
        {{generate_idea.output}}

        __ATELIER_PAYLOAD_EOF__

  - generate_plan:
      description: Produce a plan for the generated idea, inline only.
      tool: harness:claude-code
      depends_on:
        - 'require_idea.output.match(ok:\s*true)'
      retries: 2
      retry_backoff: 5
      task: |
        /agent-skills:plan

        Plan against the codebase that holds this project document —
        {{inputs.project_document}} — that is, the repo containing its
        `.atelier/project/` folder. Read the document first for the goal and
        the binding constraints. Do NOT plan against the current working
        directory: the tick may have been launched from anywhere.

        Create a plan for the following idea (use only the text between the
        "===IDEA START===" / "===IDEA END===" markers; ignore everything else):

        ---
        {{generate_idea.output}}
        ---

        IMPORTANT: Output the full plan inline in your response only. Do NOT write
        the plan to any file on disk — no `tasks/plan.md`, no `tasks/todo.md`,
        no file of any other name. The conduit stores the plan itself.

        Output format (strict):
        - Do all reasoning first; NONE of that narration may appear in the plan.
        - Emit the plan between the two marker lines below, with ONLY the plan in
          between (no preamble, no narration). Do not put a top-level "# Plan"
          heading inside; use "##" for any section headings:
          ===PLAN START===
          ===PLAN END===

  - store_idea:
      description: Assemble the idea document from the template and write it to path_idea.
      tool: harness:claude-code
      depends_on: [generate_idea, generate_plan]
      retries: 2
      retry_backoff: 5
      task: |
        Create one idea document and write it to disk.

        1. Read the template at:
           {{inputs.template_dir}}/task_template.md
           Fill the sections present in that template — it is the single source
           of truth for the section set (not re-listed here).

        2. Fill the sections:
           - "# Description": ONLY the text between the "===IDEA START===" and
             "===IDEA END===" markers in the idea below. Strip a leading
             top-level "# ..." heading if present (the template already
             provides "# Description"), and demote any other top-level "# "
             headings inside it to "## " so they don't read as document
             sections — but ONLY outside fenced code blocks: a "#"
             starting a line inside ``` fences is a code comment, leave
             it exactly as is. Discard everything outside the markers (model
             narration, the markers themselves, and the IDEA_SLUG line).
           - "# Plan": ONLY the text between the "===PLAN START===" and
             "===PLAN END===" markers in the plan below. Strip a leading
             top-level "# ..." heading if present (the template already provides
             "# Plan"). Discard everything outside the markers.
            - Frontmatter: set `priority: 3`
           - Leave "# Spec", "# User comments", "# What was done", and
             "# How was done and tested" empty. Set `creation_datetime` to the
             output of `date '+%Y-%m-%d %H:%M:%S %Z'`, and leave
             `modified_datetime` and `commits` blank — the human and the
             executor fill those later.

        3. Determine the slug from the "IDEA_SLUG:" line in the idea below.

        4. Run: mkdir -p "{{inputs.path_idea}}"
           Then write the filled document to:
           {{inputs.path_idea}}/idea_<slug>.md
           (literal prefix "idea_" followed by the slug, e.g. idea_dark-mode.md).
           If that filename already exists, do NOT overwrite it — it is an
           untriaged proposal the human has not seen yet. Append the lowest free
           numeric suffix instead: idea_<slug>.2.md, then .3.md, and so on.

        Idea:
        ---
        {{generate_idea.output}}
        ---

        Plan:
        ---
        {{generate_plan.output}}
        ---

  - advance:
      description: "Advance the per-tick counter (made: N) so the parent loop stops at target."
      tool: tool:bash
      depends_on: [store_idea]
      task: |
        python3 "{{conduit_dir}}/../autonomous-projects/scripts/loop_count.py" \
          --phase advance --target "{{inputs.target}}" --prior "{{inputs.prior}}"
