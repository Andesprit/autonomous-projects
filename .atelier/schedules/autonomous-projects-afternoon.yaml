# Working hours: fewer proposals, more execution, and a lower ceiling so the tick leaves you headroom.
#
# EDIT project_root before using this: it must be the absolute path of the
# repo holding .atelier/project/. One schedule per repo.
#
# OVERLAP: these times are 45 min apart, but a tick can run much longer (the
# conduit's own timeout is 6h, work-one-todo's is 2h). If one overruns, the next
# fires anyway and the two race over the same project files — most visibly
# 02_in-progress/, which block_stranded sweeps wholesale. tick_lock.py cannot
# guard this: it wraps a command, and `atelier scheduler` invokes the conduit
# directly. Widen the spacing to match your real tick duration, or drive ticks
# from cron wrapped in tick_lock.py instead.
# Add with: atelier schedule add .atelier/schedules/autonomous-projects-afternoon.yaml

conduit_name: autonomous-projects
# run_path is the working directory the tick runs in; point it at the same repo.
run_path: /abs/path/to/your/repo
inputs:
  project_root: /abs/path/to/your/repo
  n_ideas: "3"
  n_adhd: "1"
  n_reviews: "2"
  n_improve: "3"
  n_todo: "3"
  max_usage: "50"
schedule:
  mode: recurring
  name: autonomous-projects-afternoon
  days: [1, 2, 3, 4, 5, 6, 7]
  times:
    - "12:00"
    - "12:45"
    - "13:30"
    - "14:15"
    - "15:00"
    - "15:45"
    - "16:30"
  timezone: America/Bogota
