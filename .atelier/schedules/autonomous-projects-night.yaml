# Nobody waiting: the full default proposal load plus execution, up to a high ceiling.
#
# EDIT project_root before using this: it must be the absolute path of the
# repo holding .atelier/project/. One schedule per repo.
#
# OVERLAP: these times are 45 min apart, but a tick can run much longer (the
# conduit's own timeout is 6h, work-one-todo's is 2h). This is the heaviest
# profile — n_adhd=3 alone is ~30 agent calls — so it is the most likely to
# overrun and collide with the next firing, racing over 02_in-progress/, which
# block_stranded sweeps wholesale. tick_lock.py cannot guard this: it wraps a
# command, and `atelier scheduler` invokes the conduit directly. Widen the
# spacing to match your real tick duration, or drive ticks from cron wrapped in
# tick_lock.py instead. max_usage: "85" is the only other brake, and it fails
# open — if `node` is missing it throttles nothing at all.
# Add with: atelier schedule add .atelier/schedules/autonomous-projects-night.yaml

conduit_name: autonomous-projects
# run_path is the working directory the tick runs in; point it at the same repo.
run_path: /abs/path/to/your/repo
inputs:
  project_root: /abs/path/to/your/repo
  n_ideas: "10"
  n_adhd: "3"
  n_reviews: "5"
  n_improve: "0"
  n_todo: "5"
  max_usage: "85"
schedule:
  mode: recurring
  name: autonomous-projects-night
  days: [1, 2, 3, 4, 5, 6, 7]
  times:
    - "21:30"
    - "22:15"
    - "23:00"
    - "23:45"
    - "00:30"
    - "01:15"
    - "02:00"
    - "02:45"
    - "03:30"
    - "04:15"
    - "05:00"
    - "05:45"
  timezone: America/Bogota
