# Start of day: top up the backlog and drain whatever raw tasks you dropped overnight.
#
# EDIT project_root before using this: it must be the absolute path of the
# repo holding .atelier/project/. One schedule per repo.
# Add with: atelier schedule add .atelier/schedules/autonomous-projects-morning.yaml

conduit_name: autonomous-projects
# run_path is the working directory the tick runs in; point it at the same repo.
run_path: /abs/path/to/your/repo
inputs:
  project_root: /abs/path/to/your/repo
  n_ideas: "5"
  n_adhd: "1"
  n_reviews: "2"
  n_improve: "3"
  n_todo: "2"
  max_usage: "60"
schedule:
  mode: recurring
  name: autonomous-projects-morning
  days: [1, 2, 3, 4, 5, 6, 7]
  times:
    - "06:30"
    - "07:15"
    - "08:00"
    - "08:45"
    - "09:30"
    - "10:15"
    - "11:00"
  timezone: America/Bogota
