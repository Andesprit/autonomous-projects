name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        # The helper scripts (counters, usage gate, pickers, movers) are the
        # deterministic core; their pytest project lives here.
        working-directory: .atelier/conduits/autonomous-projects/scripts
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest -q
